<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NewsConnect Discussion</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f9fafb;
    }
    .header {
      background-color: #e11d48;
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 {
      font-size: 16px;
      margin: 0;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      background: white;
      padding: 10px 14px;
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      max-width: 85%;
    }
    .message .user {
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 4px;
      color: #e11d48;
    }
    .message .text {
      font-size: 14px;
      color: #374151;
    }
    .input-area {
      padding: 16px;
      background: white;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      outline: none;
    }
    input:focus {
      border-color: #e11d48;
    }
    button {
      background: #e11d48;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .empty-state {
      text-align: center;
      color: #6b7280;
      margin-top: 100px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    <h1>NewsConnect Discussion</h1>
  </div>
  
  <div id="chat-container" class="chat-container">
    <div class="empty-state">
      No messages yet. Be the first to start the discussion!
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="message-input" placeholder="Type your message...">
    <button id="send-btn">Send</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
